<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Havenly Work — WFH Aesthetic Workspace with Real Images</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #faf7f2;
            color: #2c2a29;
            line-height: 1.4;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e9e2d8;
        }
        ::-webkit-scrollbar-thumb {
            background: #bcafa2;
            border-radius: 10px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #e5ddd4;
        }
        .logo h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #3e3a39, #7e6b5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .logo span {
            font-size: 0.85rem;
            font-weight: 400;
            color: #9b8e82;
            display: block;
        }
        .nav-icons {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .icon-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            position: relative;
            color: #4a423c;
            transition: 0.2s;
        }
        .icon-btn:hover {
            color: #b28b6f;
            transform: translateY(-2px);
        }
        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background-color: #c17b4c;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 30px;
            padding: 0.1rem 0.45rem;
            min-width: 18px;
            text-align: center;
        }

        /* Dashboard Stats */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1.2rem;
            margin: 2rem 0 2rem 0;
        }
        .stat-card {
            background: white;
            padding: 1.2rem 1rem;
            border-radius: 28px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.02), 0 6px 6px rgba(0,0,0,0.03);
            border: 1px solid #eee7df;
            transition: all 0.2s;
        }
        .stat-card i {
            font-size: 1.8rem;
            color: #c28a62;
            margin-bottom: 0.5rem;
        }
        .stat-card h3 {
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b7a6b;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #3e2e24;
            margin-top: 0.3rem;
        }
        .stat-sub {
            font-size: 0.7rem;
            color: #aa9b8d;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 2rem 0 1rem 0;
            letter-spacing: -0.2px;
            border-left: 5px solid #dbbd9c;
            padding-left: 0.9rem;
        }

        /* Product Grid with Real Images */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03);
            border: 1px solid #f0e8e0;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 28px -12px rgba(0,0,0,0.1);
            border-color: #e1cfbc;
        }
        .product-img {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: #f3ede7;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .product-card:hover .product-img img {
            transform: scale(1.03);
        }
        .product-info {
            padding: 1rem 1.2rem 1.2rem;
        }
        .product-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }
        .product-price {
            font-weight: 700;
            color: #a97750;
            font-size: 1.2rem;
            margin: 0.5rem 0;
        }
        .add-to-cart {
            width: 100%;
            background: #f3ede7;
            border: none;
            padding: 0.6rem;
            border-radius: 40px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #5e4b38;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.3rem;
        }
        .add-to-cart:hover {
            background: #e7d9cf;
            color: #3d2c1f;
        }

        /* Cart Sidebar */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.3);
            backdrop-filter: blur(3px);
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .cart-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 420px;
            height: 100%;
            background: #fffcf8;
            box-shadow: -5px 0 30px rgba(0,0,0,0.08);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .cart-sidebar.open {
            transform: translateX(0);
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid #e9e0d6;
        }
        .cart-header h3 {
            font-size: 1.4rem;
            font-weight: 500;
        }
        .close-cart {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #8b7a6b;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.2rem;
        }
        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #efe3d8;
        }
        .cart-item-img {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            overflow: hidden;
            background: #f1eae3;
            flex-shrink: 0;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-title {
            font-weight: 500;
        }
        .cart-item-price {
            font-size: 0.8rem;
            color: #a97750;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }
        .qty-btn {
            background: #f0e7df;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .remove-item {
            color: #bf9080;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: 0.5rem;
        }
        .cart-footer {
            padding: 1.2rem;
            border-top: 1px solid #ede2d6;
            background: #fffaf5;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .checkout-btn {
            width: 100%;
            background: #dcc2aa;
            border: none;
            padding: 0.9rem;
            border-radius: 60px;
            font-weight: 600;
            color: #2f241b;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .checkout-btn:hover {
            background: #c7aa8e;
        }
        .empty-cart-msg {
            text-align: center;
            color: #b7a28e;
            padding: 2rem;
        }

        .toast-msg {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: #2e2a27;
            color: #faf0e6;
            padding: 0.7rem 1.3rem;
            border-radius: 50px;
            font-size: 0.85rem;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-msg.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0.8rem 1rem;
            }
            .dashboard-stats {
                gap: 0.8rem;
            }
            .stat-number {
                font-size: 1.5rem;
            }
            .cart-sidebar {
                max-width: 100%;
            }
            .toast-msg {
                white-space: normal;
                text-align: center;
                max-width: 85%;
            }
        }
        button {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">
            <h2>havenly.work</h2>
            <span>workspace aesthetics · real inspiration</span>
        </div>
        <div class="nav-icons">
            <button class="icon-btn" id="dashboardInfoBtn" title="Dashboard Insight">
                <i class="fas fa-chart-line"></i>
            </button>
            <button class="icon-btn" id="cartIconBtn">
                <i class="fas fa-shopping-bag"></i>
                <span id="cartCountBadge" class="cart-count">0</span>
            </button>
        </div>
    </div>

    <!-- Dashboard Stats -->
    <div class="dashboard-stats" id="dashboardStats">
        <div class="stat-card"><i class="fas fa-box-open"></i><h3>Total Produk</h3><div class="stat-number" id="totalProductsStat">0</div><div class="stat-sub">tersedia</div></div>
        <div class="stat-card"><i class="fas fa-shopping-cart"></i><h3>Keranjang</h3><div class="stat-number" id="cartItemsStat">0</div><div class="stat-sub">item unik</div></div>
        <div class="stat-card"><i class="fas fa-coins"></i><h3>Subtotal</h3><div class="stat-number" id="cartTotalStat">Rp0</div><div class="stat-sub">belum termasuk ongkir</div></div>
        <div class="stat-card"><i class="fas fa-chart-simple"></i><h3>Est. Pembelian</h3><div class="stat-number" id="purchaseCountStat">0</div><div class="stat-sub">total checkout</div></div>
    </div>

    <!-- Produk dengan Gambar Asli -->
    <div class="section-title"><i class="fas fa-laptop-house" style="margin-right: 8px;"></i> curated for calm focus · real images</div>
    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Cart Sidebar -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-sidebar" id="cartSidebar">
    <div class="cart-header">
        <h3><i class="fas fa-bag-shopping"></i> Keranjang Kerja</h3>
        <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="cart-items" id="cartItemsList">
        <div class="empty-cart-msg">Keranjang masih kosong 🌿<br> tambah produk aesthetic</div>
    </div>
    <div class="cart-footer">
        <div class="total-row">
            <span>Total Belanja</span>
            <span id="cartTotalPriceSide">Rp0</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-credit-card"></i> Checkout · Beli Sekarang</button>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    // ---------- Data Produk dengan Gambar Asli (Unsplash - WFH aesthetic) ----------
    const products = [
        { id: 1, name: "ErgoMesh Chair", price: 1850000, image: "https://images.unsplash.com/photo-1589386417684-e48cdf5b3de4?w=400&h=300&fit=crop", category: "chair" },
        { id: 2, name: "Walnut Desk Riser", price: 720000, image: "https://images.unsplash.com/photo-1518455027359-f3f8164ba6bd?w=400&h=300&fit=crop", category: "desk" },
        { id: 3, name: "Aesthetic Monitor Light Bar", price: 390000, image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&h=300&fit=crop", category: "lighting" },
        { id: 4, name: "Minimalist Coiled Cable", price: 185000, image: "https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400&h=300&fit=crop", category: "accessory" },
        { id: 5, name: "Bamboo Plant Pot", price: 145000, image: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=400&h=300&fit=crop", category: "decor" },
        { id: 6, name: "Pastel Desk Mat", price: 210000, image: "https://images.unsplash.com/photo-1583871523276-9adcfb85cb68?w=400&h=300&fit=crop", category: "accessory" },
        { id: 7, name: "Wireless Charging Pad", price: 315000, image: "https://images.unsplash.com/photo-1615529182904-14819c35db37?w=400&h=300&fit=crop", category: "gadget" },
        { id: 8, name: "Wooden Laptop Stand", price: 299000, image: "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?w=400&h=300&fit=crop", category: "stand" }
    ];

    // State
    let cart = [];              // { id, name, price, quantity, image }
    let purchaseHistoryCount = 0;

    // DOM Elements
    const productsGrid = document.getElementById('productsGrid');
    const cartItemsListEl = document.getElementById('cartItemsList');
    const cartCountBadge = document.getElementById('cartCountBadge');
    const cartTotalStat = document.getElementById('cartTotalStat');
    const cartItemsStat = document.getElementById('cartItemsStat');
    const totalProductsStat = document.getElementById('totalProductsStat');
    const purchaseCountStat = document.getElementById('purchaseCountStat');
    const cartTotalPriceSide = document.getElementById('cartTotalPriceSide');
    const cartOverlay = document.getElementById('cartOverlay');
    const cartSidebar = document.getElementById('cartSidebar');
    const openCartBtn = document.getElementById('cartIconBtn');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const checkoutButton = document.getElementById('checkoutBtn');
    const dashboardInfoBtn = document.getElementById('dashboardInfoBtn');

    // Helper format Rupiah
    function formatRupiah(amount) {
        return 'Rp' + amount.toLocaleString('id-ID');
    }

    // Update all UI
    function updateAllUI() {
        const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
        cartCountBadge.innerText = totalQty;
        
        totalProductsStat.innerText = products.length;
        const uniqueItems = cart.length;
        cartItemsStat.innerText = uniqueItems;
        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        cartTotalStat.innerText = formatRupiah(subtotal);
        purchaseCountStat.innerText = purchaseHistoryCount;
        
        cartTotalPriceSide.innerText = formatRupiah(subtotal);
        
        renderCartItems();
        renderProducts(); // refresh product grid (tetap, tombol add to cart fresh)
    }

    // LocalStorage
    function saveToLocal() {
        localStorage.setItem('wfh_cart_real', JSON.stringify(cart));
        localStorage.setItem('purchaseCount_real', purchaseHistoryCount);
    }

    function loadFromLocal() {
        const savedCart = localStorage.getItem('wfh_cart_real');
        if (savedCart) {
            try {
                cart = JSON.parse(savedCart);
            } catch(e) { cart = []; }
        } else {
            cart = [];
        }
        const savedPurchase = localStorage.getItem('purchaseCount_real');
        if(savedPurchase) purchaseHistoryCount = parseInt(savedPurchase) || 0;
        updateAllUI();
    }

    // Add to cart
    function addToCart(productId) {
        const product = products.find(p => p.id === productId);
        if (!product) return;
        const existing = cart.find(item => item.id === productId);
        if (existing) {
            existing.quantity += 1;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: 1,
                image: product.image
            });
        }
        updateAllUI();
        saveToLocal();
        showToast(`✓ ${product.name} ditambahkan ke keranjang`);
    }

    function updateCartItemQty(id, delta) {
        const index = cart.findIndex(i => i.id === id);
        if (index === -1) return;
        const newQty = cart[index].quantity + delta;
        if (newQty <= 0) {
            cart.splice(index, 1);
        } else {
            cart[index].quantity = newQty;
        }
        updateAllUI();
        saveToLocal();
    }

    function removeCartItem(id) {
        cart = cart.filter(i => i.id !== id);
        updateAllUI();
        saveToLocal();
        showToast(`Item dihapus dari keranjang`, 1500);
    }

    // Checkout
    function processCheckout() {
        if (cart.length === 0) {
            showToast("Keranjang kosong, pilih produk dulu yuk ✨", 1800);
            return;
        }
        const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
        const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        if (confirm(`🛍️ Lanjutkan pembelian? Total ${formatRupiah(totalPrice)} (${totalItems} item).\nTerima kasih telah berbelanja di havenly.work!`)) {
            purchaseHistoryCount += 1;
            cart = [];
            updateAllUI();
            saveToLocal();
            showToast(`✅ Pembelian berhasil! Terima kasih.`, 2200);
            closeCartSidebar();
        }
    }

    // Render produk dengan GAMBAR ASLI
    function renderProducts() {
        if (!productsGrid) return;
        productsGrid.innerHTML = products.map(prod => `
            <div class="product-card">
                <div class="product-img">
                    <img src="${prod.image}" alt="${prod.name}" loading="lazy">
                </div>
                <div class="product-info">
                    <div class="product-title">${prod.name}</div>
                    <div class="product-price">${formatRupiah(prod.price)}</div>
                    <button class="add-to-cart" data-id="${prod.id}"><i class="fas fa-plus-circle"></i> Tambah ke Keranjang</button>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.add-to-cart').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                addToCart(id);
            });
        });
    }

    // Render cart items dengan gambar asli
    function renderCartItems() {
        if (!cartItemsListEl) return;
        if (cart.length === 0) {
            cartItemsListEl.innerHTML = `<div class="empty-cart-msg"><i class="fas fa-basket-shopping"></i> <br/> Keranjang sepi, yuk isi dengan <br> peralatan kerja aesthetic ✨</div>`;
            return;
        }
        cartItemsListEl.innerHTML = cart.map(item => `
            <div class="cart-item">
                <div class="cart-item-img">
                    <img src="${item.image}" alt="${item.name}">
                </div>
                <div class="cart-item-details">
                    <div class="cart-item-title">${item.name}</div>
                    <div class="cart-item-price">${formatRupiah(item.price)}</div>
                    <div class="cart-item-qty">
                        <button class="qty-btn" data-id="${item.id}" data-delta="-1">-</button>
                        <span style="min-width: 28px; text-align:center;">${item.quantity}</span>
                        <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
                        <button class="remove-item" data-id="${item.id}"><i class="far fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.qty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                const delta = parseInt(btn.getAttribute('data-delta'));
                updateCartItemQty(id, delta);
            });
        });
        document.querySelectorAll('.remove-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                removeCartItem(id);
            });
        });
    }

    // Toast Notification
    let toastTimeout = null;
    function showToast(msg, duration = 1800) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        if (toastTimeout) clearTimeout(toastTimeout);
        toast.innerText = msg;
        toast.classList.add('show');
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    // Sidebar controls
    function openCartSidebar() {
        cartSidebar.classList.add('open');
        cartOverlay.classList.add('active');
        renderCartItems();
    }
    function closeCartSidebar() {
        cartSidebar.classList.remove('open');
        cartOverlay.classList.remove('active');
    }

    cartOverlay.addEventListener('click', closeCartSidebar);
    openCartBtn.addEventListener('click', openCartSidebar);
    closeCartBtn.addEventListener('click', closeCartSidebar);
    checkoutButton.addEventListener('click', () => {
        processCheckout();
    });

    dashboardInfoBtn.addEventListener('click', () => {
        const totalItemCart = cart.reduce((s,i)=> s+i.quantity,0);
        const totalSpend = cart.reduce((s,i)=> s+(i.price*i.quantity),0);
        showToast(`📊 Dashboard: ${products.length} produk | ${cart.length} jenis item | total belanja ${formatRupiah(totalSpend)}`, 2500);
    });

    // Initial Load
    loadFromLocal();
    renderProducts();
    updateAllUI();
</script>
</body>
</html>
